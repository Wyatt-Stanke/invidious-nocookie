name: Build container image

# Builds docker/Dockerfile on GitHub's runners and pushes the result to
# GitHub Container Registry (GHCR), so the deployment server never has to
# compile anything. The image is published at:
#
#   ghcr.io/<owner>/<repo>:latest   (every push to master)
#   ghcr.io/<owner>/<repo>:master
#   ghcr.io/<owner>/<repo>:<short sha>
#   ghcr.io/<owner>/<repo>:<tag>    (for v* tags)
#
# The package is private by default. Either make it public once in the
# GitHub Packages settings, or give Coolify pull credentials for GHCR.

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
      - LICENCE
      - TRANSLATION
      - invidious.service
      - .git*
      - .editorconfig
      - screenshots/*
      - .github/ISSUE_TEMPLATE/*
      - kubernetes/**
      - docker-compose*.yml
      - .envrc
      - "nix/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # amd64 only. To add arm64, add a matrix entry on `ubuntu-24.04-arm`
    # with platform linux/arm64/v8 and combine the manifests afterwards,
    # as upstream Invidious does.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=tag

      - name: Build metadata
        id: build_meta
        run: |
          echo "commit=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            release=1
            INVIDIOUS_BRANCH=${{ github.ref_name }}
            INVIDIOUS_COMMIT=${{ steps.build_meta.outputs.commit }}
            INVIDIOUS_VERSION=${{ steps.build_meta.outputs.version }}

      # Optional: ask Coolify to redeploy once the new image is available.
      # Set two repository secrets to enable this:
      #   COOLIFY_DEPLOY_URL   e.g. https://coolify.example.com/api/v1/deploy?uuid=<resource uuid>
      #   COOLIFY_API_TOKEN    an API token created in Coolify (Keys & Tokens)
      - name: Trigger Coolify redeploy
        if: github.ref == 'refs/heads/master'
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "Coolify secrets not set, skipping redeploy trigger."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_URL"
