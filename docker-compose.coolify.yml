# Self-contained compose file for deploying this fork on Coolify.
#
# Differences from the upstream docker-compose.yml:
#   - no bind mounts: `check_tables: true` makes Invidious create its own
#     tables, so the SQL init script is not needed
#   - no `ports:`; Coolify's proxy routes to the `expose`d port of the
#     service you attach a domain to (invidious, port 3000)
#   - the database password and HMAC key come from Coolify "magic" variables
#     (SERVICE_PASSWORD_*), which Coolify generates on first deploy
#   - two values must be filled in by hand in the Environment tab:
#       INVIDIOUS_DOMAIN        bare hostname of the instance
#       COMPANION_SECRET_KEY    must be EXACTLY 16 characters (both Invidious
#                               and the companion refuse any other length);
#                               generate with `pwgen 16 1` or
#                               `openssl rand -hex 8`
#
# The image is built by .github/workflows/build-container.yml on every push
# to master and published to GHCR, so nothing is compiled on the server.
# (Building on the server is possible but needs several GB of RAM.)
#
# In Coolify, create a "Docker Compose Empty" resource and paste this file,
# or use this repo as a "Docker Compose" git resource pointing at
# /docker-compose.coolify.yml. Either way Coolify only pulls the image.
# If the GHCR package is private, add GHCR credentials to Coolify first.

services:
  invidious:
    image: ghcr.io/wyatt-stanke/invidious-nocookie:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${SERVICE_PASSWORD_POSTGRES}
          host: invidious-db
          port: 5432
        check_tables: true
        domain: ${INVIDIOUS_DOMAIN}
        https_only: true
        hmac_key: ${SERVICE_PASSWORD_64_HMAC}
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: ${COMPANION_SECRET_KEY}
        # Comment these in if you want a public instance to opt in/out:
        # registration_enabled: false
        # login_enabled: false
        # statistics_enabled: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "100m"
        max-file: "4"
    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_started

  # Still required: this fork only ever asks the companion for the
  # /youtubei/v1/player *metadata* (title, description, captions, etc).
  # No media is requested through it, so its bandwidth use is negligible.
  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=${COMPANION_SECRET_KEY}
    logging:
      options:
        max-size: "100m"
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
  companioncache:
